name: Hosted search diagnostic
on:
  push:
    branches: [tipjar/hosted-search-diagnostic]
permissions:
  contents: read
jobs:
  inspect-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect fixed public query response categories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile, time
          from urllib.parse import urlencode
          queries = [('readme_first', '"tipjar:welcome:v1" filename:README.md path:/'), ('manifest_second', 'filename:.tipjar.json path:/')]
          for index, (label, query) in enumerate(queries):
              if index: time.sleep(15)
              endpoint='search/code?'+urlencode({'q':query,'per_page':5,'page':1})
              env=dict(os.environ,GH_PROMPT_DISABLED='1',GH_NO_UPDATE_NOTIFIER='1')
              env.pop('GH_DEBUG',None)
              try:
                  with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                      result=subprocess.run(['gh','api','--hostname','github.com','--method','GET',endpoint],stdin=subprocess.DEVNULL,stdout=out,stderr=err,timeout=30,shell=False,env=env)
                      out.seek(0);err.seek(0)
                      raw=out.read(8*1024*1024+1);error=err.read(4096).decode('utf-8',errors='replace')
                  status=re.search(r'HTTP ([1-5][0-9]{2})\b',error)
                  status=int(status.group(1)) if status else (200 if result.returncode==0 else None)
                  try: value=json.loads(raw) if len(raw)<=8*1024*1024 else None
                  except (ValueError,UnicodeError): value=None
                  shape=isinstance(value,dict) and type(value.get('total_count')) is int and type(value.get('incomplete_results')) is bool and isinstance(value.get('items'),list)
                  print(json.dumps({'query':label,'status':status,'returncode':result.returncode,'search_envelope':shape,'rate_word':bool(re.search(r'rate.?limit|secondary.?limit',error,re.I))}),flush=True)
              except Exception:
                  print(json.dumps({'query':label,'category':'transport_failure'}),flush=True)
          PY
